[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[project]
name = "devtech-newton-examples"
version = "0.1.0"
description = "Newton simulation examples from NVIDIA DevTech"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = [
    "newton[examples]>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "cuda: requires an NVIDIA GPU and a working CUDA driver",
]

[tool.uv.build-backend]
module-name = "examples"
module-root = ""

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = ["I"]
