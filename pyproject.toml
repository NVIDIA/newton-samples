[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[project]
name = "newton-samples"
version = "1.0.0"
description = "Newton simulation examples from NVIDIA DevTech"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "newton[examples]>=1.6.0",
]

[project.urls]
Repository = "https://github.com/NVIDIA/newton-samples"
Documentation = "https://github.com/NVIDIA/newton-samples/blob/main/README.md"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "cuda: requires an NVIDIA GPU and a working CUDA driver",
]

[tool.uv.build-backend]
module-name = "examples"
module-root = ""

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
# Minimum patched versions for transitive dependencies reported by nSpect and OSV.
constraint-dependencies = [
    "anyio>=4.15.1",
    "cryptography>=50.0.2",
    "mcp>=1.30.0,<2",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "pyjwt>=2.15.1",
    "setuptools>=84.0.0",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
]
