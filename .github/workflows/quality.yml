name: CPU tests and quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The locked imgui-bundle has Linux wheels starting at Python 3.11.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint tested code
        run: |
          uv run --locked ruff check tests examples/multiphysics/example_franka_pulley_mechanical_advantage.py
          uv run --locked ruff format --check tests examples/multiphysics/example_franka_pulley_mechanical_advantage.py
      - name: Run CPU tests
        run: uv run --locked pytest -m "not cuda" --junitxml=test-results/cpu.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-cpu-${{ matrix.python-version }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
