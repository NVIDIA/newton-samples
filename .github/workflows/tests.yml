name: GPU tests

on:
  push:
    branches:
      - main
      # NVIDIA copy-pr-bot copies vetted PR commits to these branches.
      # Do not run pull_request events directly on the NVIDIA runners.
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: Full suite / RTX PRO 6000
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run full suite with CUDA required
        run: uv run --locked pytest --require-cuda --junitxml=test-results/cuda.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-cuda
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
