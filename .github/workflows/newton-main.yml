name: Nightly GPU tests against Newton main

on:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newton-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: Newton main / RTX PRO 6000
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 30
    env:
      WARP_CACHE_PATH: ${{ github.workspace }}/.cache/warp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify NVIDIA GPU
        run: nvidia-smi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      - name: Resolve latest Newton main
        # Override Newton only in this checkout. Explicitly refresh the Git
        # revision so a cached resolution cannot keep testing an older commit.
        run: uv add --no-sync --upgrade-package newton "newton[examples] @ git+https://github.com/newton-physics/newton.git@main"
      - name: Install resolved dependencies
        run: uv sync --locked --dev
      - name: Cache compiled Warp kernels
        uses: ./.github/actions/cache-warp
      - name: Record installed dependencies
        run: |
          mkdir -p test-results
          uv pip freeze | tee test-results/environment.txt
      - name: Run full suite with CUDA required
        run: uv run --locked pytest --require-cuda --durations=10 --junitxml=test-results/cuda.xml
      - name: Upload test results and resolved dependencies
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tests-newton-main-cuda
          path: |
            test-results/
            pyproject.toml
            uv.lock
          retention-days: 14
          if-no-files-found: warn
